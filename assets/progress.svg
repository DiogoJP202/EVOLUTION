<svg width="780" height="120" viewBox="0 0 780 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Progresso da trilha Fullstack C#/.NET</title>
  <desc id="desc">Barra de progresso animada indicando o inicio da trilha de estudos.</desc>
  <defs>
    <linearGradient id="progressGradient" x1="32" y1="82" x2="104" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16A34A">
        <animate attributeName="stop-color" values="#16A34A;#0891B2;#2563EB;#16A34A" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#22C55E">
        <animate attributeName="stop-color" values="#22C55E;#38BDF8;#60A5FA;#22C55E" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <pattern id="diagonalStripes" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(35)">
      <rect width="6" height="12" fill="#FFFFFF" opacity="0.24">
        <animate attributeName="opacity" values="0.16;0.36;0.16" dur="1.8s" repeatCount="indefinite"/>
      </rect>
    </pattern>
    <clipPath id="progressClip">
      <rect x="32" y="82" width="72" height="16" rx="8"/>
    </clipPath>
  </defs>
  <rect width="780" height="120" rx="16" fill="#101828"/>
  <text x="32" y="38" fill="#F9FAFB" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Trilha Fullstack C#/.NET</text>
  <text x="32" y="66" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="14">Progresso inicial: estrutura criada</text>
  <rect x="32" y="82" width="716" height="16" rx="8" fill="#344054"/>
  <g clip-path="url(#progressClip)">
    <rect x="32" y="82" width="72" height="16" rx="8" fill="url(#progressGradient)"/>
    <rect x="32" y="82" width="72" height="16" rx="8" fill="url(#diagonalStripes)"/>
  </g>
  <text x="690" y="66" fill="#F9FAFB" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">10%</text>
</svg>
